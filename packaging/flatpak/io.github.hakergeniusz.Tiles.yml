app-id: io.github.hakergeniusz.Tiles
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  # No explicit branch: flatpak resolves it from the SDK metadata
  # (org.freedesktop.Sdk.Extension point, version=25.08 for GNOME 50).
  - org.freedesktop.Sdk.Extension.rust-stable
command: tiles
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  prepend-ld-library-path: /usr/lib/sdk/rust-stable/lib
  # generated-sources.json writes the vendor replacement to cargo/config;
  # pointing CARGO_HOME there makes cargo pick it up (offline builds).
  env:
    CARGO_HOME: /run/build/tiles/cargo
modules:
  - name: tiles
    buildsystem: simple
    build-commands:
      - cargo build --release --offline
      - install -Dm755 target/release/tiles -t /app/bin/
      - install -Dm644 packaging/io.github.hakergeniusz.Tiles.desktop -t /app/share/applications/
      - install -Dm644 resources/tiles.svg /app/share/icons/hicolor/scalable/apps/io.github.hakergeniusz.Tiles.svg
      - install -Dm644 packaging/io.github.hakergeniusz.Tiles.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: dir
        path: ../..
      - generated-sources.json
